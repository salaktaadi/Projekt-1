<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perseus Dataworks // Céges Feladatkezelő</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #07090e;
            --card-bg: #111827;
            --card-bg-hover: #1f2937;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
            --border: #1f2937;
            --warning: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 24px 30px;
        }

        .dashboard-container {
            width: 100%;
            max-width: 1600px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 24px;
            flex-grow: 1;
        }

        /* Fejléc logóval és márkajelzéssel */
        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 18px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .brand-box {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .brand-logo {
            width: 52px;
            height: 52px;
            object-fit: contain;
            border-radius: 10px;
            background: #000;
            padding: 4px;
            border: 1px solid var(--border);
        }

        .header-title h1 {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #ffffff;
        }

        .header-title p {
            color: var(--accent);
            font-size: 0.82rem;
            letter-spacing: 0.5px;
            font-weight: 600;
            margin-top: 2px;
        }

        .stats-grid {
            display: flex;
            gap: 16px;
        }

        .stat-card {
            background: var(--bg-color);
            border: 1px solid var(--border);
            padding: 10px 18px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .stat-icon {
            font-size: 1.1rem;
        }

        .stat-info .value {
            font-size: 1.15rem;
            font-weight: 700;
        }

        .stat-info .label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        /* Fő tartalom */
        .main-grid {
            display: grid;
            grid-template-columns: 2.2fr 1fr;
            gap: 24px;
            flex-grow: 1;
        }

        @media (max-width: 1024px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .controls-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .search-box {
            flex-grow: 1;
            min-width: 200px;
        }

        .search-box input {
            width: 100%;
            background: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px 14px;
            color: var(--text-main);
            font-size: 0.9rem;
            outline: none;
            transition: 0.2s;
        }

        .search-box input:focus {
            border-color: var(--accent);
        }

        .filter-buttons {
            display: flex;
            gap: 6px;
        }

        .filter-btn {
            background: var(--bg-color);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 9px 14px;
            font-size: 0.84rem;
            font-weight: 500;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
        }

        .filter-btn:hover {
            color: var(--text-main);
            border-color: var(--text-muted);
        }

        .filter-btn.active {
            background: rgba(56, 189, 248, 0.15);
            border-color: var(--accent);
            color: var(--accent);
            font-weight: 600;
        }

        .btn-secondary {
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 9px 16px;
            font-size: 0.88rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .btn-secondary:hover {
            background: var(--accent);
            color: var(--bg-color);
        }

        .btn-today {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 9px 14px;
            font-size: 0.88rem;
            font-weight: 500;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-today:hover {
            background: var(--border);
            color: var(--text-main);
        }

        .calendar-dropdown-container {
            position: relative;
        }

        .calendar-dropdown {
            display: none;
            position: absolute;
            right: 0;
            top: calc(100% + 10px);
            width: 320px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 18px;
            box-shadow: 0 20px 30px rgba(0,0,0,0.8);
            z-index: 100;
        }

        .calendar-dropdown.active {
            display: block;
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .calendar-header h3 {
            font-size: 0.95rem;
            font-weight: 600;
            text-transform: capitalize;
        }

        .nav-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-main);
            width: 28px;
            height: 28px;
            border-radius: 6px;
            cursor: pointer;
        }

        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-weight: 600;
        }

        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }

        .day {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid transparent;
        }

        .day:hover {
            background: var(--card-bg-hover);
        }

        .day.selected {
            background: var(--accent);
            color: var(--bg-color);
            font-weight: 700;
        }

        .day.today {
            border-color: var(--accent);
        }

        .task-dot {
            width: 4px;
            height: 4px;
            background-color: var(--accent);
            border-radius: 50%;
            margin-top: 2px;
        }

        .day.selected .task-dot {
            background-color: var(--bg-color);
        }

        .section-header {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .tasks-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            max-height: 600px;
            padding-right: 4px;
        }

        .task-card {
            background: var(--bg-color);
            border: 1px solid var(--border);
            padding: 16px 20px;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .task-card:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
            background: var(--card-bg-hover);
        }

        .task-card.important {
            border-color: var(--warning);
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.08), var(--bg-color));
        }

        .task-card.important:hover {
            border-color: #fbbf24;
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.14), var(--card-bg-hover));
        }

        .task-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .task-badge {
            display: inline-block;
            background: rgba(245, 158, 11, 0.15);
            color: var(--warning);
            font-size: 0.72rem;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 6px;
        }

        .task-card-title {
            font-size: 1rem;
            font-weight: 600;
        }

        .task-card-date {
            font-size: 0.78rem;
            color: var(--accent);
            font-weight: 500;
        }

        .no-tasks {
            text-align: center;
            color: var(--text-muted);
            padding: 50px 0;
            font-size: 0.95rem;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 1000;
        }

        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 30px;
            border-radius: 18px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 25px 35px rgba(0,0,0,0.7);
        }

        .modal-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .modal-desc {
            font-size: 0.95rem;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 24px;
            white-space: pre-wrap;
        }

        .close-btn {
            background: var(--accent);
            color: var(--bg-color);
            border: none;
            padding: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            transition: 0.2s;
        }

        .close-btn:hover {
            background: var(--accent-hover);
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <!-- Fejléc Perseus logóval -->
        <div class="header-section">
            <div class="brand-box">
                <img src="logo.png" alt="Perseus Dataworks Logo" class="brand-logo">
                <div class="header-title">
                    <h1>PERSEUS DATAWORKS</h1>
                    <p>Vállalati Feladatkezelő Rendszer</p>
                </div>
            </div>
            
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon">📅</div>
                    <div class="stat-info">
                        <div class="value" id="statToday">0</div>
                        <div class="label">Mai feladat</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">⭐</div>
                    <div class="stat-info">
                        <div class="value" id="statImportant">0</div>
                        <div class="label">Fontos</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">📁</div>
                    <div class="stat-info">
                        <div class="value" id="statTotal">0</div>
                        <div class="label">Összes</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Fő grid -->
        <div class="main-grid">
            <div class="panel">
                <div class="controls-bar">
                    <div class="search-box">
                        <input type="text" id="searchInput" placeholder="Keresés a céges feladatok között..." oninput="onSearchInput()">
                    </div>

                    <div class="filter-buttons">
                        <button class="filter-btn active" id="filterAllBtn" onclick="setFilter('all')">Minden</button>
                        <button class="filter-btn" id="filterImpBtn" onclick="setFilter('important')">⭐ Fontos</button>
                    </div>

                    <button class="btn-today" onclick="selectToday()">Ma</button>

                    <div class="calendar-dropdown-container">
                        <button class="btn-secondary" onclick="toggleCalendar()">
                            📅 Naptár
                        </button>

                        <div class="calendar-dropdown" id="calendarDropdown">
                            <div class="calendar-header">
                                <button class="nav-btn" onclick="changeMonth(-1)">&lt;</button>
                                <h3 id="monthYearDisplay">Hónap Év</h3>
                                <button class="nav-btn" onclick="changeMonth(1)">&gt;</button>
                            </div>
                            <div class="weekdays">
                                <div>H</div><div>K</div><div>Sze</div><div>Cs</div><div>P</div><div>Szo</div><div>V</div>
                            </div>
                            <div class="days-grid" id="daysGrid"></div>
                        </div>
                    </div>
                </div>

                <div class="section-header">
                    <span id="selectedDateTitle">Aznapi teendők</span>
                </div>
                <div class="tasks-list" id="tasksContainer">
                    <div class="no-tasks">Betöltés...</div>
                </div>
            </div>

            <div class="panel">
                <div class="section-header">Közelgő céges teendők (7 nap)</div>
                <div class="tasks-list" id="upcomingContainer">
                    <div class="no-tasks">Nincsenek közelgő feladatok.</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modális ablak -->
    <div class="modal" id="taskModal" onclick="closeModalOnBg(event)">
        <div class="modal-content">
            <h3 class="modal-title" id="modalTitle">Cím</h3>
            <p class="modal-desc" id="modalDesc">Leírás...</p>
            <button class="close-btn" onclick="closeModal()">Bezárás</button>
        </div>
    </div>

    <script>
        let allTasks = [];
        let currentDate = new Date();
        let selectedDateStr = formatDateKey(new Date());
        let currentFilter = 'all';

        function formatDateKey(date) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        async function loadTasks() {
            try {
                const res = await fetch('tasks.json');
                if (!res.ok) throw new Error();
                allTasks = await res.json();
            } catch (e) {
                allTasks = [];
            }
            updateStats();
            renderCalendar();
            renderTasks();
            renderUpcomingTasks();
        }

        function updateStats() {
            const todayStr = formatDateKey(new Date());
            const todayCount = allTasks.filter(t => t.date === todayStr).length;
            const impCount = allTasks.filter(t => t.important).length;

            document.getElementById('statToday').innerText = todayCount;
            document.getElementById('statImportant').innerText = impCount;
            document.getElementById('statTotal').innerText = allTasks.length;
        }

        function toggleCalendar() {
            document.getElementById('calendarDropdown').classList.toggle('active');
        }

        window.onclick = function(e) {
            if (!e.target.closest('.calendar-dropdown-container')) {
                document.getElementById('calendarDropdown').classList.remove('active');
            }
        }

        function selectToday() {
            currentDate = new Date();
            selectedDateStr = formatDateKey(currentDate);
            currentFilter = 'all';
            updateFilterButtonsUI();
            document.getElementById('searchInput').value = '';
            renderCalendar();
            renderTasks();
        }

        function setFilter(filterType) {
            currentFilter = filterType;
            updateFilterButtonsUI();
            renderTasks();
        }

        function updateFilterButtonsUI() {
            document.getElementById('filterAllBtn').classList.toggle('active', currentFilter === 'all');
            document.getElementById('filterImpBtn').classList.toggle('active', currentFilter === 'important');
        }

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            const monthNames = ["január", "február", "március", "április", "május", "június", "július", "augusztus", "szeptember", "október", "november", "december"];
            document.getElementById('monthYearDisplay').innerText = `${monthNames[month]} ${year}`;

            const daysGrid = document.getElementById('daysGrid');
            daysGrid.innerHTML = '';

            const firstDayIndex = (new Date(year, month, 1).getDay() + 6) % 7;
            const totalDays = new Date(year, month + 1, 0).getDate();
            const todayStr = formatDateKey(new Date());

            for (let i = 0; i < firstDayIndex; i++) {
                daysGrid.appendChild(document.createElement('div'));
            }

            for (let day = 1; day <= totalDays; day++) {
                const dateObj = new Date(year, month, day);
                const dateStr = formatDateKey(dateObj);

                const dayDiv = document.createElement('div');
                dayDiv.className = 'day';
                if (dateStr === todayStr) dayDiv.classList.add('today');
                if (dateStr === selectedDateStr && currentFilter === 'all') dayDiv.classList.add('selected');

                dayDiv.innerHTML = `<span>${day}</span>`;

                if (allTasks.some(t => t.date === dateStr)) {
                    const dot = document.createElement('div');
                    dot.className = 'task-dot';
                    dayDiv.appendChild(dot);
                }

                dayDiv.onclick = () => {
                    selectedDateStr = dateStr;
                    currentFilter = 'all';
                    updateFilterButtonsUI();
                    document.getElementById('searchInput').value = '';
                    renderCalendar();
                    renderTasks();
                    toggleCalendar();
                };

                daysGrid.appendChild(dayDiv);
            }
        }

        function changeMonth(dir) {
            currentDate.setMonth(currentDate.getMonth() + dir);
            renderCalendar();
        }

        function renderTasks() {
            const container = document.getElementById('tasksContainer');
            const titleEl = document.getElementById('selectedDateTitle');
            const searchQuery = document.getElementById('searchInput').value.toLowerCase().trim();

            let tasksToDisplay = [];

            if (searchQuery) {
                titleEl.innerText = `Keresés: "${searchQuery}"`;
                tasksToDisplay = allTasks.filter(t => 
                    t.title.toLowerCase().includes(searchQuery) || 
                    (t.description && t.description.toLowerCase().includes(searchQuery)) ||
                    (t.category && t.category.toLowerCase().includes(searchQuery))
                );
            } else if (currentFilter === 'important') {
                titleEl.innerText = `Összes kiemelten fontos céges feladat`;
                tasksToDisplay = allTasks.filter(t => t.important);
            } else {
                const [y, m, d] = selectedDateStr.split('-');
                const dateObj = new Date(y, m - 1, d);
                titleEl.innerText = dateObj.toLocaleDateString('hu-HU', { month: 'long', day: 'numeric', weekday: 'long' });
                tasksToDisplay = allTasks.filter(t => t.date === selectedDateStr);
            }

            if (tasksToDisplay.length === 0) {
                container.innerHTML = `<div class="no-tasks">Nincsenek megjeleníthető feladatok.</div>`;
                return;
            }

            container.innerHTML = '';
            tasksToDisplay.forEach(task => {
                const card = document.createElement('div');
                card.className = task.important ? 'task-card important' : 'task-card';
                card.onclick = () => openModal(task.title, task.description);
                card.innerHTML = `
                    <div class="task-header-row">
                        <div class="task-card-title">${escapeHtml(task.title)}</div>
                        ${task.important ? '<span class="task-badge">⭐ Fontos</span>' : ''}
                    </div>
                    <div class="task-card-date">🏷️ ${escapeHtml(task.category || 'Általános')} &nbsp;|&nbsp; 📅 ${task.date}</div>
                `;
                container.appendChild(card);
            });
        }

        function renderUpcomingTasks() {
            const container = document.getElementById('upcomingContainer');
            const todayStr = formatDateKey(new Date());

            const upcoming = allTasks
                .filter(t => t.date >= todayStr)
                .sort((a, b) => a.date.localeCompare(b.date))
                .slice(0, 6);

            if (upcoming.length === 0) {
                container.innerHTML = `<div class="no-tasks">Nincsenek közelgő feladatok.</div>`;
                return;
            }

            container.innerHTML = '';
            upcoming.forEach(task => {
                const card = document.createElement('div');
                card.className = task.important ? 'task-card important' : 'task-card';
                card.onclick = () => openModal(task.title, task.description);
                card.innerHTML = `
                    <div class="task-header-row">
                        <div class="task-card-title">${escapeHtml(task.title)}</div>
                        ${task.important ? '<span class="task-badge">⭐</span>' : ''}
                    </div>
                    <div class="task-card-date">📅 ${task.date}</div>
                `;
                container.appendChild(card);
            });
        }

        function onSearchInput() {
            renderTasks();
        }

        function openModal(title, desc) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalDesc').innerText = desc || 'Nincs részletes leírás megadva.';
            document.getElementById('taskModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('taskModal').style.display = 'none';
        }

        function closeModalOnBg(e) {
            if (e.target.id === 'taskModal') closeModal();
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        loadTasks();
    </script>
</body>
</html>
